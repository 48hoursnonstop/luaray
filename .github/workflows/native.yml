name: Native Lua regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install missing native build dependencies
        shell: bash
        run: |
          packages=()
          command -v cc >/dev/null && command -v c++ >/dev/null || packages+=(build-essential)
          command -v make >/dev/null || packages+=(make)
          command -v lua5.4 >/dev/null || packages+=(lua5.4)
          if command -v pkg-config >/dev/null; then
            pkg-config --exists lua5.4 || packages+=(liblua5.4-dev)
            pkg-config --exists blas || packages+=(libblas-dev)
            pkg-config --exists lapack || packages+=(liblapack-dev)
          else
            packages+=(pkg-config liblua5.4-dev libblas-dev liblapack-dev)
          fi
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Build and execute all frozen native and Lua regressions
        run: make -j4 full-test CXXFLAGS='-O0 -g -std=c++11 -Wall -Wextra -Wpedantic'
      - name: Execute public Lua module examples
        env:
          LUA_PATH: './lua/?.lua;;'
          LUA_CPATH: './build/?.so;;'
        run: |
          lua5.4 examples/writing98.lua
          lua5.4 examples/masked_writes99.lua
          lua5.4 examples/take100.lua
          lua5.4 examples/along101.lua
          lua5.4 examples/choose102.lua
          lua5.4 examples/condition103.lua
